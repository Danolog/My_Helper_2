name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # ESLint: krok pada tylko na błędach (eslint bez --max-warnings);
      # ostrzeżenia są widoczne w logu, ale nie blokują.
      - name: ESLint
        run: pnpm lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # __tests__/lint/drizzle-journal-base.test.ts czyta dziennik migracji
      # z origin/main (git show). Wystarczy sam czubek main, bez historii.
      - name: Fetch main for migration journal check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-24.04 # Playwright 1.58.2 nie obsługuje Ubuntu 26 (ubuntu-latest)
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: pos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev_user -d pos_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_URL: postgresql://dev_user:dev_password@localhost:5432/pos_dev
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      # Testy na prawdziwym Postgresie biegną po seedzie (krok niżej).
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Schemat bazy WYLACZNIE z migracji: 0005 tworzy role myhelper_app i polityki
      # RLS, bez ktorych kazda transakcja forSalon (SET LOCAL ROLE) pada. BEZ
      # db:push po migracjach (#190): drizzle-kit push traktuje polityki z 0005
      # jako dryf, wylacza RLS i usuwa polityki na 39 tabelach — baza w CI
      # bylaby bez izolacji salonow. Straznik pada, gdy ktorejs tabeli z 0005
      # brakuje RLS albo polityki z migracji (scripts/db-rls-guard.ts).
      - name: Run database migrations
        run: pnpm db:migrate
      - name: RLS guard (migration 0005)
        run: pnpm exec tsx scripts/db-rls-guard.ts

      - name: Seed test data
        run: pnpm db:seed:test

      - name: Verify seed data
        run: |
          PGPASSWORD=dev_password psql -h localhost -U dev_user -d pos_dev -c "SELECT id, email, email_verified, role FROM \"user\" WHERE email IN ('owner@test.com','client@test.com');"
          PGPASSWORD=dev_password psql -h localhost -U dev_user -d pos_dev -c "SELECT id, provider_id, user_id, CASE WHEN password IS NOT NULL THEN 'SET' ELSE 'NULL' END as pwd FROM account WHERE user_id IN ('test-owner-user-id-00001','test-client-user-id-00001');"
      - name: Seed check
        run: pnpm exec tsx scripts/verify-seed.ts

      # Testy na prawdziwym Postgresie (`pnpm test:pg`, pliki po kolei), po seedzie:
      # - T3: blokady subskrypcji (confirm ‖ webhook, pg_locks, 40P01); własne
      #   wiersze z unikalnymi id, sprzątane po teście;
      # - porównanie baz przed przełączeniem (infra/db/cutover/compare.sh):
      #   pos_dev po seedzie → zrzut danych → druga baza po migracjach. Bazy testu
      #   (prefiks it_cutover_) tworzy i usuwa sam test, pos_dev tylko czyta.
      #   psql/pg_dump/pg_restore w wersji serwera: z kontenera usługi postgres
      #   (docker exec przez cienkie nakładki, które test tworzy w katalogu
      #   tymczasowym) — bez apt i bez nowych obrazów.
      # - zamrożenie/odmrożenie bazy źródłowej (infra/db/cutover/freeze-neon.sh,
      #   unfreeze-neon.sh): własna baza i role it_cutover_, zrywanie po bazie,
      #   zapis na nowym połączeniu read_only / po odmrożeniu przechodzi; ta sama
      #   bramka i ten sam klient PG z kontenera co porównanie.
      # - przeniesienie danych (infra/db/cutover/copy-neon-to-cloudsql.sh, jeden
      #   strumień pg_dump | pg_restore bez pliku) i kontrola RLS (rls-check.sh):
      #   własne bazy it_cutover_, pos_dev tylko czytana; przerwany strumień →
      #   cel pusty; ta sama bramka i ten sam klient PG z kontenera.
      # - wycofanie przełączenia (infra/db/cutover/copy-cloudsql-to-neon.sh,
      #   strumień pg_dump -Fp | psql z jedną transakcją i bramką kompletności):
      #   własne bazy it_cutover_ zamrożone freeze-neon.sh, pos_dev tylko czytana
      #   (nigdy zamrażana); pliki SQL skryptu kopiowane do kontenera usługi
      #   (docker cp) pod tę samą ścieżkę; ta sama bramka i ten sam klient PG.
      # Adres = ten sam service container (localhost), bez nowych sekretów.
      - name: Integration test — subscription locks (real Postgres)
        timeout-minutes: 5
        run: pnpm test:pg
        env:
          INTEGRATION_POSTGRES_URL: postgresql://dev_user:dev_password@localhost:5432/pos_dev
          CUTOVER_COMPARE_PG: "1"
          CUTOVER_PG_CONTAINER: ${{ job.services.postgres.id }}

      # Seed drugi raz po test:pg, przed Playwrightem: test działający globalnie
      # (cleanup, cron, agregaty) nie może po cichu zmienić wierszy seeda, na
      # których stoi @smoke — wtedy czerwony ten krok, nie flakujący E2E.
      - name: Seed check (after test:pg)
        run: pnpm exec tsx scripts/verify-seed.ts

      # Bez --with-deps: pobieranie pakietów systemowych (apt) potrafi trwać
      # minuty i zjadało limit joba. Obraz runnera ma biblioteki Chromium;
      # brak dodatkowych czcionek nie wpływa na testy (nie porównują zrzutów).
      - name: Install Chromium (no apt)
        timeout-minutes: 3
        run: pnpm exec playwright install chromium

      - run: pnpm build:ci

      - name: Run smoke tests
        run: pnpm exec playwright test --grep @smoke --workers=4 --retries=1
        # #69: serwer E2E (`pnpm start` z playwright webServer, NODE_ENV=production,
        # bez klucza Stripe) symuluje płatność zadatku tylko z tą flagą. Flaga
        # żyje WYŁĄCZNIE w krokach E2E — nie w .env*, nie w Vercelu (tam
        # VERCEL=1 i handler ją ignoruje z błędem w logu).
        env:
          PLAYWRIGHT_TIMEOUT: 15000
          ALLOW_PAYMENT_SIMULATION: "1"

      # Strażnik RLS drugi raz, po ostatnim kroku z bazą (#194 Z1): RLS zdjęte
      # W TRAKCIE joba (push w dowolnej postaci) = czerwony job. `!cancelled()`:
      # krok biegnie też po wcześniejszej porażce (nie jest pomijany), a sam
      # niczego nie maskuje — porażka wcześniejszego kroku zostaje porażką joba.
      - name: RLS guard (end of job)
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/db-rls-guard.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-report
          path: |
            playwright-report/
            test-results.json
            tests/.auth/*.png
          retention-days: 7

  e2e-full:
    name: E2E Full Tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e-smoke]
    runs-on: ubuntu-24.04 # Playwright 1.58.2 nie obsługuje Ubuntu 26 (ubuntu-latest)
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: pos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev_user -d pos_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_URL: postgresql://dev_user:dev_password@localhost:5432/pos_dev
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Schemat bazy WYLACZNIE z migracji: 0005 tworzy role myhelper_app i polityki
      # RLS, bez ktorych kazda transakcja forSalon (SET LOCAL ROLE) pada. BEZ
      # db:push po migracjach (#190): drizzle-kit push traktuje polityki z 0005
      # jako dryf, wylacza RLS i usuwa polityki na 39 tabelach — baza w CI
      # bylaby bez izolacji salonow. Straznik pada, gdy ktorejs tabeli z 0005
      # brakuje RLS albo polityki z migracji (scripts/db-rls-guard.ts).
      - name: Run database migrations
        run: pnpm db:migrate
      - name: RLS guard (migration 0005)
        run: pnpm exec tsx scripts/db-rls-guard.ts

      - name: Seed test data
        run: pnpm db:seed:test

      # Kontrola seeda — jak w e2e-smoke.
      - name: Seed check
        run: pnpm exec tsx scripts/verify-seed.ts

      # Bez --with-deps — jak w e2e-smoke.
      - name: Install Chromium (no apt)
        timeout-minutes: 3
        run: pnpm exec playwright install chromium

      - run: pnpm build:ci

      - name: Run full E2E tests
        run: pnpm exec playwright test --grep @full --workers=2 --retries=1
        # #69: serwer E2E (`pnpm start` z playwright webServer, NODE_ENV=production,
        # bez klucza Stripe) symuluje płatność zadatku tylko z tą flagą. Flaga
        # żyje WYŁĄCZNIE w krokach E2E — nie w .env*, nie w Vercelu (tam
        # VERCEL=1 i handler ją ignoruje z błędem w logu).
        env:
          ALLOW_PAYMENT_SIMULATION: "1"

      # Kontrola seeda drugi raz, po zielonych testach E2E @full: użytkownicy testowi z kontem z hasłem, plany i dostęp salonów testowych nadal zgodne z seedem.
      - name: Seed check (after E2E)
        run: pnpm exec tsx scripts/verify-seed.ts

      # Strażnik RLS drugi raz, po ostatnim kroku z bazą (#194 Z1) — jak w e2e-smoke.
      - name: RLS guard (end of job)
        if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/db-rls-guard.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-full-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high
