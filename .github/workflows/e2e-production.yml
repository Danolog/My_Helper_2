name: Production E2E

on:
  # Vercel — zostaje do C4 (brief C §3).
  deployment_status:
  # Cloud Run — wywoływany z deploy-cloud-run.yml po promocji nowej wersji.
  workflow_call:
    inputs:
      base_url:
        description: "Adres wdrożenia do sprawdzenia (https://…)"
        type: string
        required: false
  # Ręcznie, np. po awaryjnym run-deploy.sh z terminala.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Adres wdrożenia do sprawdzenia (https://…); pusty = produkcja z sekretu"
        type: string
        required: false

jobs:
  e2e-production:
    name: Production Health Checks
    # deployment_status: tylko udane wdrożenie środowiska Production (Vercel
    # ustawia environment "Production" / "Preview"). Wcześniej warunek sprawdzał
    # sam stan, więc job biegł też po każdym Preview, celując i tak w URL
    # produkcji z sekretu. workflow_call / workflow_dispatch: zawsze.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04 # Playwright 1.58.2 nie obsługuje Ubuntu 26 (ubuntu-latest)
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.base_url || secrets.BETTER_AUTH_BASE_URL_PROD }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run production health checks
        run: pnpm exec playwright test --grep @production --workers=2 --retries=1 --timeout=15000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-production-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 7
