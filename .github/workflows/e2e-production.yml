name: Production E2E

on:
  # Cloud Run — wywoływany z deploy-cloud-run.yml po promocji nowej wersji;
  # testy idą WYŁĄCZNIE na inputs.base_url (adres taga Cloud Run).
  workflow_call:
    inputs:
      base_url:
        description: "Adres wdrożenia Cloud Run do sprawdzenia (https://…)"
        type: string
        required: true

jobs:
  e2e-production:
    name: Production Health Checks
    runs-on: ubuntu-24.04 # Playwright 1.58.2 nie obsługuje Ubuntu 26 (ubuntu-latest)
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.base_url }}
      CI: true
    steps:
      # Allowlista (#121 h): wyłącznie URL taga NASZEJ usługi Cloud Run —
      # https://<tag>---myhelper-843777043748.europe-central2.run.app
      # (deterministyczny format: tag, usługa, numer projektu, region; tag jak
      # REVISION_TAG w run-deploy.sh). Odrzucone: pusty, http, vercel.app,
      # cudze *.run.app, adres bez taga, ścieżka, userinfo, port.
      - name: Base URL must be our tagged Cloud Run URL
        run: |
          if [[ -z "$BASE_URL" || "$BASE_URL" != https://* || "$BASE_URL" == *vercel.app* ]] \
            || ! [[ "$BASE_URL" =~ ^https://[a-z][a-z0-9-]{0,45}---myhelper-843777043748\.europe-central2\.run\.app/?$ ]]; then
            echo "::error::base_url must be the tagged URL of our Cloud Run service (got empty, non-https, Vercel or other host)"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Bez --with-deps: pobieranie pakietów systemowych (apt) potrafi trwać
      # minuty i zjadało limit joba. Obraz runnera ma biblioteki Chromium;
      # brak dodatkowych czcionek nie wpływa na testy (nie porównują zrzutów).
      - name: Install Chromium (no apt)
        timeout-minutes: 3
        run: pnpm exec playwright install chromium

      # Gdyby obraz runnera stracił bibliotekę potrzebną Chromium: czytelny błąd
      # środowiska przed testami zamiast czerwonych testów.
      - name: "Environment: Chromium starts"
        timeout-minutes: 1
        run: |
          node -e "require('@playwright/test').chromium.launch().then(b=>b.close())" \
            || { echo "::error title=CI environment not ready::Chromium does not start on the runner; tests were not run (this is not a failing test)"; exit 1; }

      - name: Run production health checks
        run: pnpm exec playwright test --grep @production --workers=2 --retries=1 --timeout=15000

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-production-report
          path: |
            playwright-report/
            test-results.json
          retention-days: 7
