# Nakładka na docker-compose.yml: aplikacja z obrazu (Dockerfile) obok
# lokalnej bazy pos_dev. Tylko lokalnie — żadnych prawdziwych sekretów.
#
# Kolejność:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d postgres
#   docker compose -f docker-compose.yml -f docker-compose.app.yml run --rm migrate
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d app
#   curl -i http://localhost:8080/api/health
#
# Uwaga: `migrate` (infra/db/migrate.mjs) migruje bazę pos_dev z docker-compose.yml,
# a docker-compose.yml publikuje 5432 na hoście — nie uruchamiać obok innej
# lokalnej bazy na 5432. Aplikacja słucha tylko na 127.0.0.1.
services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      POSTGRES_URL: postgresql://dev_user:dev_password@postgres:5432/pos_dev
    depends_on:
      - postgres
    profiles: ["migrate"]

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POSTGRES_URL: postgresql://dev_user:dev_password@postgres:5432/pos_dev
      BETTER_AUTH_URL: http://localhost:8080
      # Wartość testowa (32+ znaki) — tylko lokalnie, nie sekret.
      BETTER_AUTH_SECRET: local-compose-test-secret-min-32-characters
      STORAGE_DRIVER: local
    depends_on:
      - postgres
